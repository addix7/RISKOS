version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: riskos_db
    environment:
      POSTGRES_USER: riskos
      POSTGRES_PASSWORD: riskos_dev
      POSTGRES_DB: riskos_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riskos -d riskos_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: riskos_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://riskos:riskos_dev@db:5432/riskos_db
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production-riskos-2025}
      MODEL_ARTIFACT_PATH: ./models/risk_model.pkl
      ENV: development
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: